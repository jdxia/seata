server:
  address: 127.0.0.1
  port: 18081
  shutdown: graceful

spring:
  application:
    name: seata-learning-boot
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  main:
    allow-circular-references: true
    banner-mode: off
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/seata_learning_boot?useUnicode=true&characterEncoding=utf-8&useSSL=false&verifyServerCertificate=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: ${DEMO_DB_USERNAME:root}
    password: ${DEMO_DB_PASSWORD:hello.world123}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5

seata:
  application-id: ${spring.application.name}
  tx-service-group: trade_order_tx_group # 事务组, 根据这个获取tc服务的cluster名称
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  config:
    # 从 Nacos 读取客户端事务配置。
    type: nacos
    nacos:
      server-addr: 192.168.33.20:8848
      namespace: "seata" # Nacos 命名空间 ID。
      group: SEATA_GROUP
      data-id: seata-client-trade.properties
      username: nacos
      password: nacos
  registry:
    type: nacos
    nacos:
      application: seata-server-demo     # 和tc 保持一致, tc 服务在 nacos 中的服务名称
      server-addr: 192.168.33.20:8848
      namespace: "seata" # 填写与 TC 相同的命名空间 ID。
      group: SEATA_GROUP
      username: nacos
      password: nacos
  service: # 如果nacos已经配置, 这边就没什么用了, 它不能作为远端缺少映射时的自动回退
    vgroup-mapping:
      # 键对应 tx-service-group，值对应 TC 的 registry.nacos.cluster。
      trade_order_tx_group: tradeOrderTxCluster
